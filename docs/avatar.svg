<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="3D-аватар Никиты">
  <defs>
    <radialGradient id="bgA" cx="50%" cy="35%" r="70%">
      <stop offset="0" stop-color="#1D3A8A"/>
      <stop offset=".6" stop-color="#0C1640"/>
      <stop offset="1" stop-color="#070B22"/>
    </radialGradient>
    <radialGradient id="skin" cx="42%" cy="38%" r="70%">
      <stop offset="0" stop-color="#FAD9BD"/>
      <stop offset=".55" stop-color="#EDBE98"/>
      <stop offset="1" stop-color="#C98E6A"/>
    </radialGradient>
    <linearGradient id="neck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B97E5C"/>
      <stop offset="1" stop-color="#DDA884"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E4F0FF"/>
      <stop offset=".5" stop-color="#B7D2F4"/>
      <stop offset="1" stop-color="#7FA6DA"/>
    </linearGradient>
    <linearGradient id="collar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2F8FF"/>
      <stop offset="1" stop-color="#A9C6EE"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4B3326"/>
      <stop offset=".5" stop-color="#2B1C15"/>
      <stop offset="1" stop-color="#160E0A"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#49D3FF" stop-opacity="0"/>
      <stop offset="1" stop-color="#49D3FF" stop-opacity=".55"/>
    </linearGradient>
    <radialGradient id="cheek" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#E9967A" stop-opacity=".45"/>
      <stop offset="1" stop-color="#E9967A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="iris" cx="40%" cy="35%" r="60%">
      <stop offset="0" stop-color="#7A5233"/>
      <stop offset="1" stop-color="#2A170C"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity=".45"/></filter>
  </defs>

  <rect width="400" height="400" fill="url(#bgA)"/>
  <circle cx="200" cy="170" r="150" fill="#2F7BFF" opacity=".18" filter="url(#soft)"/>

  <g filter="url(#shadow)" transform="translate(200 230) scale(1.08) translate(-200 -222)">
    <!-- плечи и рубашка -->
    <path d="M40 400 C 52 318, 110 288, 160 280 L 240 280 C 290 288, 348 318, 360 400 Z" fill="url(#shirt)"/>
    <path d="M90 400 C 100 350, 120 320, 150 302" stroke="#9DBBE6" stroke-width="5" fill="none" opacity=".6" stroke-linecap="round"/>
    <path d="M310 400 C 300 350, 282 322, 252 304" stroke="#6E95CC" stroke-width="5" fill="none" opacity=".5" stroke-linecap="round"/>
    <!-- шея -->
    <path d="M168 230 L 232 230 L 236 300 C 222 318, 178 318, 164 300 Z" fill="url(#neck)"/>
    <path d="M168 262 C 186 276, 214 276, 232 262 L 232 240 L 168 240 Z" fill="#9C6448" opacity=".35"/>
    <!-- воротник -->
    <path d="M160 282 L 200 330 L 176 352 L 140 300 Z" fill="url(#collar)"/>
    <path d="M240 282 L 200 330 L 224 352 L 260 300 Z" fill="url(#collar)"/>
    <path d="M200 330 L 200 400" stroke="#8FB0DE" stroke-width="3"/>
    <circle cx="200" cy="356" r="4" fill="#8FB0DE"/>
    <circle cx="200" cy="384" r="4" fill="#8FB0DE"/>

    <!-- уши -->
    <ellipse cx="128" cy="178" rx="14" ry="22" fill="#E2AA84"/>
    <ellipse cx="272" cy="178" rx="14" ry="22" fill="#D79E78"/>
    <ellipse cx="130" cy="179" rx="6" ry="11" fill="#C4876A" opacity=".6"/>
    <ellipse cx="270" cy="179" rx="6" ry="11" fill="#B9795C" opacity=".6"/>

    <!-- голова -->
    <path d="M200 92 C 252 92, 274 128, 272 176 C 270 222, 244 256, 200 258 C 156 256, 130 222, 128 176 C 126 128, 148 92, 200 92 Z" fill="url(#skin)"/>
    <!-- лёгкая щетина по линии челюсти -->
    <path d="M140 200 C 150 236, 172 254, 200 256 C 228 254, 250 236, 260 200 C 252 226, 230 244, 200 246 C 170 244, 148 226, 140 200 Z" fill="#7A5240" opacity=".18"/>
    <path d="M240 110 C 268 130, 276 180, 262 214 C 252 236, 232 252, 206 258 C 240 238, 262 200, 258 160 C 256 136, 250 120, 240 110 Z" fill="#A86B4C" opacity=".22"/>
    <!-- румянец -->
    <ellipse cx="160" cy="200" rx="18" ry="11" fill="url(#cheek)"/>
    <ellipse cx="240" cy="200" rx="18" ry="11" fill="url(#cheek)"/>

    <!-- волосы: объёмная волна набок -->
    <path d="M122 176 C 104 120, 124 62, 178 44 C 222 30, 276 46, 292 96 C 300 126, 290 158, 276 180
             C 274 154, 266 134, 252 124 C 236 138, 206 136, 184 122 C 174 138, 152 148, 138 156 C 132 164, 126 170, 122 176 Z"
          fill="url(#hair)"/>
    <path d="M136 112 C 132 80, 156 56, 186 52 C 170 66, 162 84, 164 104 C 154 102, 144 106, 136 112 Z" fill="#3A271D"/>
    <path d="M164 104 C 166 72, 196 48, 232 50 C 214 62, 204 80, 206 100 C 192 96, 176 98, 164 104 Z" fill="#4E3527"/>
    <path d="M206 100 C 212 70, 244 52, 276 66 C 256 72, 244 90, 246 112 C 234 104, 220 100, 206 100 Z" fill="#3F2A1F"/>
    <path d="M246 112 C 252 92, 272 80, 288 96 C 280 108, 276 124, 278 142 C 270 130, 258 118, 246 112 Z" fill="#2E1E16"/>
    <path d="M150 74 C 168 58, 196 50, 222 52" stroke="#8C654D" stroke-width="3" fill="none" stroke-linecap="round" opacity=".7"/>
    <path d="M214 62 C 236 56, 258 60, 274 74" stroke="#8C654D" stroke-width="3" fill="none" stroke-linecap="round" opacity=".6"/>
    <path d="M140 100 C 146 84, 156 74, 170 68" stroke="#7A5641" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".6"/>
    <path d="M184 122 C 198 104, 230 100, 252 124" stroke="#1C120D" stroke-width="5" fill="none" stroke-linecap="round" opacity=".6"/>
    <!-- прядь, падающая на лоб -->
    <path d="M210 116 C 228 126, 236 146, 230 160 C 224 142, 212 132, 198 126 Z" fill="#2B1C15"/>

    <!-- брови -->
    <path d="M150 158 C 160 148, 180 146, 190 152" stroke="#2A1A12" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M210 152 C 220 146, 240 148, 250 158" stroke="#2A1A12" stroke-width="7" fill="none" stroke-linecap="round"/>

    <!-- глаза -->
    <ellipse cx="170" cy="178" rx="15" ry="11" fill="#FFFFFF"/>
    <ellipse cx="230" cy="178" rx="15" ry="11" fill="#FFFFFF"/>
    <circle cx="171" cy="180" r="8.5" fill="url(#iris)"/>
    <circle cx="231" cy="180" r="8.5" fill="url(#iris)"/>
    <circle cx="171" cy="180" r="4" fill="#120904"/>
    <circle cx="231" cy="180" r="4" fill="#120904"/>
    <circle cx="174" cy="176.5" r="2.6" fill="#fff"/>
    <circle cx="234" cy="176.5" r="2.6" fill="#fff"/>
    <!-- верхнее веко чуть прикрыто: спокойный взгляд -->
    <path d="M154 176 C 160 164, 182 164, 186 176 C 180 171, 162 171, 154 176 Z" fill="#D9A27E"/>
    <path d="M214 176 C 220 164, 242 164, 246 176 C 238 171, 220 171, 214 176 Z" fill="#D9A27E"/>
    <path d="M155 176 C 162 168, 180 168, 186 176" stroke="#3A2418" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <path d="M214 176 C 220 168, 238 168, 245 176" stroke="#3A2418" stroke-width="2.6" fill="none" stroke-linecap="round"/>

    <!-- нос -->
    <path d="M202 184 C 206 200, 210 210, 206 216 C 202 220, 194 220, 190 216" stroke="#B57A57" stroke-width="3" fill="none" stroke-linecap="round" opacity=".8"/>
    <ellipse cx="204" cy="208" rx="9" ry="6" fill="#FFE7D4" opacity=".35"/>

    <!-- улыбка -->
    <path d="M180 232 C 192 240, 210 240, 222 230" stroke="#9A4F3C" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M186 236 C 196 242, 206 242, 216 236" stroke="#D88A72" stroke-width="3" fill="none" stroke-linecap="round" opacity=".5"/>

    <!-- блик на лбу и щеке -->
    <ellipse cx="178" cy="140" rx="22" ry="10" fill="#fff" opacity=".18" filter="url(#soft)"/>
    <ellipse cx="152" cy="206" rx="8" ry="5" fill="#fff" opacity=".2" filter="url(#soft)"/>
  </g>

  <!-- неоновая контровая подсветка справа -->
  <path d="M272 120 C 284 160, 276 214, 246 246" stroke="#49D3FF" stroke-width="4" fill="none" opacity=".55" filter="url(#soft)"/>
  <path d="M300 320 C 330 340, 350 368, 356 400" stroke="#49D3FF" stroke-width="5" fill="none" opacity=".45" filter="url(#soft)"/>
</svg>
