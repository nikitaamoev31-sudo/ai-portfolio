name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  java-job-tracker-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: job-tracker-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and test
        run: mvn -B verify

  python-rag-docs-assistant:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag-docs-assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
